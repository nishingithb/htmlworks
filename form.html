<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="border: 2px solid black; width: 500px; margin: auto; padding: 20px;">
        <h3>User Details</h3>
    <form>
<label>Username:</label>
<input type="text">
<br>
<br>

<label>Password:</label>
<input type="password">
<br>
<br>

<label>DOB:</label>
<input type="date">
<br>
<br>

<label>Age:</label>
<input type="number">
<br>
<br>

<label>Gender:</label>
<input type="radio" name="g">male
<input type="radio" name="g">female
<br>
<br>

<label>Email:</label>
<input type="email">
<br>
<br>

<label>Address:</label>
<textarea rows="1" cols="20"> 
write your address here....
</textarea>
<br>
<br>

<label>Qualification:</label>
<select>
    <option>BBA</option>
    <option>BCA</option>
    <option>BSC</option>
    <option>BTECH</option>
    <option>MTECH</option>
</select>

<br>
<br>
<label>Interest:</label><br>
<input type="checkbox">sports<br>
<input type="checkbox">travel<br>
<input type="checkbox">music<br>
<br>

<label>Send CV</label>
<input type="file">
<br>
<br>

<h3>VIDEO</h3>
<video src="video.mp4" autoplay muted loop controls width="500px" height="250"></video><br><br>

<h3>AUDIO</h3>
<audio src="audio.mp3" controls></audio>

<input type="submit" value="Register"><br><br>
<input type="reset" value="Start Again">
    </form>
    </div>
</body>
</html>
