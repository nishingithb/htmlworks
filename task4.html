<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: auto;
            height: auto;
        }

        .red {
            height: 200px;
            background-color: red;
        }

        .yellow {
            height: 200px;
            background-color: yellow;
        }

        .green {
            height: 200px;
            background-color: green;
        }

        .orange {
            height: 200px;
            background-color: orange;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="red"></div>
        <div class="yellow"></div>
        <div class="green"></div>
        <div class="orange"></div>
    </div>
    
</body>
</html>
